[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-todos"
version = "0.1.0"
description = "Demo/portfolio FastAPI todo API showcasing scalable backend patterns: hexagonal layers, DI, PostgreSQL, JWT auth, migrations, and tests."
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel Illescas Romero" }]
requires-python = ">=3.14"
dependencies = [
	"alembic>=1.14.0",
	"argon2-cffi>=23.1.0",
	"asyncpg>=0.30.0",
	"fastapi[standard]>=0.110.0",
	"greenlet>=3.5.1",
	"pydantic>=2.0.0",
	"PyJWT>=2.8.0",
	"slowapi>=0.1.9",
	"sqlalchemy>=2.0.50",
	"uvicorn>=0.30.0",
	"valkey>=6.1",
]

[project.optional-dependencies]
dev = [
	"basedpyright>=1.29",
	"import-linter>=2.1",
	"msgpack>=1.2.1",
	"pip-audit>=2.7",
	"pytest>=8.0",
	"pytest-asyncio>=0.24",
	"pytest-cov>=6.0",
	"ruff",
]

[project.urls]
Homepage = "https://github.com/illescasDaniel/todos-fastapi"

[tool.setuptools.packages.find]
where = ["src"]
include = ["todos_app*"]

# --- RUFF (Linter & Import Sorter) ---
[tool.ruff]
line-length = 120
target-version = 'py314'
src = ['src', 'tests']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['src', 'tests']
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'session'
asyncio_default_test_loop_scope = 'session'
markers = [
	'unit: fast tests without I/O',
	'integration: tests that use PostgreSQL or HTTP',
]

[tool.coverage.run]
source = ["todos_app"]
omit = ["*/shared/adapters/persistence/seeding/*", "alembic/env.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
# Enable specific rules:
# F = Pyflakes (Finds unused imports/variables)
# I = isort (Sorts imports)
# E = pycodestyle errors
# S = flake8-bandit (security)
# B = flake8-bugbear (likely bugs and design issues)
select = ['F', 'I', 'E', 'S', 'B']
# Allow fixing for all enabled rules (imports will be removed/sorted automatically)
fixable = ['ALL']
# --- RUFF end ---

[tool.ruff.lint.isort]
# Ensure compatibility with YAPF's vertical style
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
# assert, password fixtures, secret strings, and long lines are expected in test code
"tests/**" = ["S101", "S105", "S106", "E501"]
"mcp/todos-backend/tests/**" = ["S101", "S105", "S106", "S108"]
"scripts/**" = ["S603", "S607"]
# FastAPI uses Query/Depends in default args — B008 is a false positive in routers
"src/todos_app/todos/adapters/api/router.py" = ["B008"]
# assert isinstance() in exception handlers is a deliberate type narrowing pattern
"src/todos_app/runtime/exceptions.py" = ["S101"]
"src/todos_app/runtime/app.py" = ["S101"]
# String constants named INVALID_TOKEN / token_type are not passwords
"src/todos_app/shared/http_errors.py" = ["S105"]
"src/todos_app/auth/adapters/api/schemas.py" = ["S105"]
# main.py intentionally binds to 0.0.0.0 for container deployments; assert callable is a type guard
"src/todos_app/main.py" = ["S101", "S104", "E501"]
# Pre-existing long function signature; cannot be broken up without changing the API
"src/todos_app/users/adapters/api/router.py" = ["E501"]
# Profile TOML intentionally contains placeholder secrets (example/test templates)
"config/profiles/**" = ["S105", "S106"]

# --- Type checking (Cursor Pyright / basedpyright) ---
[tool.basedpyright]
typeCheckingMode = "strict"
include = ["src", "tests", "mcp/todos-backend/src", "mcp/todos-backend/tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
extraPaths = ["tests", "mcp/todos-backend/src", "src"]
reportMissingTypeStubs = false
executionEnvironments = [
	{ root = "mcp/todos-backend/src/todos_mcp/tools", reportUnusedFunction = false },
	{ root = "src" },
]

# --- Import contracts (feature-first boundaries) ---
[tool.importlinter]
root_package = "todos_app"

[[tool.importlinter.contracts]]
name = "Todos does not import users"
type = "forbidden"
source_modules = ["todos_app.todos"]
forbidden_modules = ["todos_app.users"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Users does not import todos"
type = "forbidden"
source_modules = ["todos_app.users"]
forbidden_modules = ["todos_app.todos"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Auth domain/application do not import users"
type = "forbidden"
source_modules = ["todos_app.auth.domain", "todos_app.auth.application"]
forbidden_modules = ["todos_app.users"]

[[tool.importlinter.contracts]]
name = "Shared kernel does not import features or runtime"
type = "forbidden"
source_modules = [
	"todos_app.shared.config",
	"todos_app.shared.settings",
	"todos_app.shared.logging",
	"todos_app.shared.ids",
	"todos_app.shared.http_errors",
	"todos_app.shared.error_responses",
	"todos_app.shared.rate_limiting",
	"todos_app.shared.dependencies",
	"todos_app.shared.adapters.persistence",
	"todos_app.shared.adapters.cache",
	"todos_app.shared.adapters.api.health",
	"todos_app.shared.adapters.api.openapi_responses",
]
forbidden_modules = [
	"todos_app.auth",
	"todos_app.users",
	"todos_app.todos",
	"todos_app.idempotency",
	"todos_app.runtime",
]

[[tool.importlinter.contracts]]
name = "Feature domains do not import adapters, application, or runtime"
type = "forbidden"
source_modules = [
	"todos_app.auth.domain",
	"todos_app.users.domain",
	"todos_app.todos.domain",
	"todos_app.idempotency.domain",
]
forbidden_modules = [
	"todos_app.auth.adapters",
	"todos_app.auth.application",
	"todos_app.users.adapters",
	"todos_app.users.application",
	"todos_app.todos.adapters",
	"todos_app.todos.application",
	"todos_app.idempotency.adapters",
	"todos_app.idempotency.application",
	"todos_app.runtime",
]
